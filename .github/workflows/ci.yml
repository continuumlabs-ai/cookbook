name: Recipes

on:
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab
  push:
  pull_request:
  schedule:
    - cron: "0 20 * * 0" # weekly, Monday 7am Melbourne time

jobs:
  offline:
    name: Offline tests (stand-in model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  live:
    name: Live run against the endpoint
    runs-on: ubuntu-latest
    needs: offline
    # Runs only when the repository variable LIVE_TESTS is true. Skipped for pull requests from forks, which get no secrets.
    if: ${{ vars.LIVE_TESTS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: write
    env:
      CONTINUUM_API_KEY: ${{ secrets.CONTINUUM_API_KEY }}
      CONTINUUM_BASE_URL: ${{ vars.CONTINUUM_BASE_URL }}
      CONTINUUM_MODEL: ${{ vars.CONTINUUM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p output
      - run: python agents/contract-review/recipe.py --out output/contract 2>&1 | tee output/contract-console.txt
      - run: python agents/research-analyst/recipe.py --out output/research 2>&1 | tee output/research-console.txt
      - run: python batch/announcement-monitor/recipe.py --out output/monitor 2>&1 | tee output/monitor-console.txt
      - run: python jobs/bookkeeper-invoices/recipe.py --out output/bookkeeper 2>&1 | tee output/bookkeeper-console.txt
      - run: python jobs/aged-care-incidents/recipe.py --out output/aged-care 2>&1 | tee output/aged-care-console.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recipe-output
          path: output/
      - name: Publish reports to the live-results branch
        if: always() && github.event_name != 'pull_request'
        run: |
          cd output
          {
            echo "# Latest live run"
            echo
            echo "Model: \`$CONTINUUM_MODEL\`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Commit: ${{ github.sha }}."
            echo
            echo "Every input is fictional sample data from this repository."
          } > README.md
          git init -q -b live-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Live run ${{ github.run_id }} [skip ci]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-results

  scorecard:
    name: Australian work scorecard
    runs-on: ubuntu-latest
    needs: offline
    # Weekly, on demand, or when a commit message contains [scorecard]. It calls several models, so not on every push.
    if: ${{ vars.LIVE_TESTS == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[scorecard]')) }}
    permissions:
      contents: write
    env:
      CONTINUUM_API_KEY: ${{ secrets.CONTINUUM_API_KEY }}
      CONTINUUM_BASE_URL: ${{ vars.CONTINUUM_BASE_URL }}
      CONTINUUM_SCORECARD_MODELS: ${{ vars.CONTINUUM_SCORECARD_MODELS || vars.CONTINUUM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p output/scorecard && python scorecard/run.py --out output/scorecard 2>&1 | tee output/scorecard/console.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard
          path: output/scorecard/
      - name: Publish to the scorecard branch
        if: always() && github.event_name != 'pull_request'
        run: |
          cp scorecard/answers.json output/scorecard/
          cd output/scorecard
          [ -f scorecard.md ] && cp scorecard.md README.md
          git init -q -b scorecard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Scorecard run ${{ github.run_id }} [skip ci]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" scorecard
