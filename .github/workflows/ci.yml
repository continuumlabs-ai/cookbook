name: Recipes

on:
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab
  push:
  pull_request:
  schedule:
    - cron: "0 20 * * 0" # weekly, Monday 7am Melbourne time

jobs:
  offline:
    name: Offline tests (stand-in model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  live:
    name: Live run against the endpoint
    runs-on: ubuntu-latest
    needs: offline
    # Runs only when the repository variable LIVE_TESTS is set to true and the key is stored as a secret.
    if: ${{ vars.LIVE_TESTS == 'true' }}
    env:
      CONTINUUM_API_KEY: ${{ secrets.CONTINUUM_API_KEY }}
      CONTINUUM_BASE_URL: ${{ vars.CONTINUUM_BASE_URL }}
      CONTINUUM_MODEL: ${{ vars.CONTINUUM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python agents/contract-review/recipe.py --out output/contract
      - run: python agents/research-analyst/recipe.py --out output/research
      - run: python batch/announcement-monitor/recipe.py --out output/monitor
      - uses: actions/upload-artifact@v4
        with:
          name: recipe-output
          path: output/
